name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch (much smaller than the default CUDA build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Unit tests (use a fake embedder, no model download)
        run: pytest -q

  chat-view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - name: Type-check (strict) and build the RagChat component
        run: npm run build

  integrated-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tone-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the locked T-One dependencies
        run: npx --yes --registry=https://registry.npmjs.org pnpm@8.15.9 install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Build the integrated help assistant
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=6144
